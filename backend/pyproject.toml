[project]
name = "backend"
version = "0.1.0"
description = "Chatbot for creating checklists for software testing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.135.2",
    "httpx>=0.28.1",
    "langchain>=1.2.10",
    "langchain-mistralai>=1.1.2",
    "langchain-ollama>=1.0.1",
    "pydantic>=2.12.5",
    "ruff>=0.15.6",
    "supabase>=2.28.3",
    "uvicorn>=0.42.0",
    "openpyxl>=3.1.0",
    "langchain-openai>=1.2.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
pythonpath = "src"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
